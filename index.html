<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2oolzgenie</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #7c9cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2240, var(--bg));
      color: var(--fg);
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.03em;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid #2a3145;
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>2oolzgenie</h1>
    <p>Engineering assistant workspace. Small, clear, and ready to grow.</p>
    <span class="badge">hello from main</span>
  </main>
</body>
</html>
